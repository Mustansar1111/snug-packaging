<!DOCTYPE html>
<html>
  <head><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms reads these at deploy time. Keep the field names in step with QuoteForm.tsx and MockupForm.tsx. -->
    <form name="quote" data-netlify="true" netlify-honeypot="company_website" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input name="style" /><input name="quantity" /><input name="units" /><input name="dimensions" /><input name="finish" />
      <input name="name" /><input name="country" /><input name="email" /><input name="phone" /><input name="reply_by" /><textarea name="message"></textarea>
      <input type="file" name="artwork" />
      <input name="page" /><input name="company_website" />
    </form>
    <form name="mockup" data-netlify="true" netlify-honeypot="company_website" hidden>
      <input type="hidden" name="form-name" value="mockup" />
      <input name="email" /><input name="page" /><input name="company_website" />
    </form>
  </body>
</html>
